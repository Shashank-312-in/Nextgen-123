[pytest]
markers =
    slow: test takes noticeably longer than the rest of the suite (run explicitly with -m slow)
asyncio_mode = auto
# — scratch/ exclusion
# WHY this has to live here, not just in run_all_tests.py: scratch/ holds
# one-off manual DB maintenance scripts (test_admin_role.py etc.), not real
# pytest tests. They execute live database mutations at MODULE IMPORT time
# (collection), so plain `pytest` from the repo root previously aborted
# collection entirely the moment it reached scratch/ — before a single real
# test ran — regardless of which runner script a person used to invoke it.
norecursedirs = scratch .git .venv venv node_modules frontend
